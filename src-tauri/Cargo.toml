[package]
name = "asgard-crm"
version.workspace = true
description = "Asgard CRM — gestion et facturation pour micro-entrepreneurs"
authors = ["Asgard CRM"]
license.workspace = true
repository.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
name = "asgard_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Logique metier : montants, cotisations, seuils, agregats (phase 3).
asgard-core = { path = "../crates/asgard-core" }
asgard-ipc = { path = "../crates/asgard-ipc" }
asgard-pdf = { path = "../crates/asgard-pdf" }

tauri = { version = "2", features = [] }
# Dialogue d'enregistrement natif. Corrige au passage un point reste ouvert
# depuis la phase 1 : les exports passaient par un `<a download>` sur une URL
# blob:, chemin que la CSP de Tauri rend incertain et qu'on ne pouvait pas
# tester depuis l'environnement de developpement.
tauri-plugin-dialog = "2"
# Journal : sans lui, une panne chez l'utilisateur ne laisse aucune trace, et
# le diagnostic se résume à des suppositions.
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SMTP — remplace nodemailer (phase 1)
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "rustls-tls",
    "rustls-platform-verifier",
] }

# Trousseau de l'OS — sort le mot de passe SMTP de localStorage (défaut D2)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

thiserror = "2"

# Base de donnees fichier — remplace Dexie / IndexedDB (phase 2)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
# `#[tokio::test]` et `tokio::join!` n'existent qu'avec les macros et un runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
