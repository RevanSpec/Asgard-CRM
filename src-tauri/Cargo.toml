[package]
name = "asgard-crm"
version = "0.1.0"
description = "Asgard CRM — gestion et facturation pour micro-entrepreneurs"
authors = ["Asgard CRM"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "asgard_crm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Logique metier : montants, cotisations, seuils, agregats (phase 3).
asgard-core = { path = "../crates/asgard-core" }

tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# SMTP — remplace nodemailer (phase 1)
lettre = { version = "0.11", default-features = false, features = [
    "smtp-transport",
    "builder",
    "hostname",
    "rustls-tls",
    "rustls-platform-verifier",
] }
base64 = "0.22"

# Trousseau de l'OS — sort le mot de passe SMTP de localStorage (défaut D2)
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

thiserror = "2"

# Base de donnees fichier — remplace Dexie / IndexedDB (phase 2)
sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["sync"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }

[dev-dependencies]
# `#[tokio::test]` et `tokio::join!` n'existent qu'avec les macros et un runtime.
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
