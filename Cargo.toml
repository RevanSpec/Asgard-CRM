# Espace de travail Cargo.
#
# `asgard-core` porte la logique métier, sans aucune dépendance à Tauri ni à
# SQLite : c'est ce qui la rend testable en isolation et réutilisable. `src-tauri`
# n'est que l'hôte qui l'expose à l'interface.
[workspace]
resolver = "2"
members = ["src-tauri", "crates/asgard-core", "crates/asgard-pdf"]

[workspace.dependencies]
# `serde-float` serialise les Decimal en nombres JSON et non en chaines.
# L'interface appelle .toFixed(2) et .toLocaleString() sur les montants recus :
# une chaine casserait tout, silencieusement. La perte de precision est
# acceptable ici, c'est le dernier maillon avant l'affichage et les montants
# sont deja arrondis au centime.
rust_decimal = { version = "1", default-features = false, features = ["serde-float", "std"] }
rust_decimal_macros = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"

# Profil de publication.
#
# Dans un espace de travail, Cargo **ignore** les profils declares par les
# packages membres — il ne lit que ceux de la racine, en le signalant par un
# avertissement facile a manquer dans un log de compilation. Les avoir laisses
# dans src-tauri/Cargo.toml faisait passer le binaire de 5,7 a 14,2 Mo sans que
# rien d'autre ne l'indique.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
